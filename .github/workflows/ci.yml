name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core and app tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t xi-node:ci .
      - name: Run container
        run: |
          docker run -d --name xi-node-ci -p 127.0.0.1:8787:8787 xi-node:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health
      - name: Logs
        if: always()
        run: docker logs xi-node-ci || true
      - name: Cleanup
        if: always()
        run: docker rm -f xi-node-ci || true